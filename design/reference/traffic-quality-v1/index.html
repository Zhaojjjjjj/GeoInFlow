<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>浏览流量质量 · 补充界面参考</title><link rel="stylesheet" href="../../prototypes/liekan-ui-v1/assets/styles.css"></head>
<body><main class="main"><section class="panel"><div class="panel-head"><div><h2>浏览流量质量</h2><p>沿用采集设置的面板、表格、按钮与宽抽屉样式。</p></div></div><div class="panel-body"><p>顺序：统计口径 → 统计策略 → 采集诊断 → 行为风险观察 → 质量明细。</p><p>统计口径使用指标、原始、纳入、排除四列表格；UV 分别去重。策略修改先预览后保存，历史配置恢复也经过预览。质量和风险读取由用户手动刷新。</p><p>行为风险默认只观察，显示规则、计算时间、覆盖、原因和影响预览。缺失、部分覆盖与暂不支持各有文字状态。</p><p>入口放入网站设置的采集设置。保留原总览图表、指标卡、导航、颜色和间距。桌面采用宽抽屉，移动端沿用现有对话框和表格滚动规则，无新增动效。</p></div></section></main></body></html>
