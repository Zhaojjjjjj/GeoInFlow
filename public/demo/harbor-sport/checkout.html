<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Secure Checkout</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar"><div class="brand">Harbor Sport</div><nav class="nav"><span>Delivery</span><span>Payment</span><span>Review</span></nav><button class="bag">Secure</button></header>
    <main class="checkout">
      <h1>Checkout</h1>
      <div class="summary">
        <section class="card"><h3>Delivery details</h3><p>Email, shipping address, and delivery preferences for global orders.</p><div class="pill-list"><span class="pill">Standard</span><span class="pill">Express</span><span class="pill">Store pickup</span></div></section>
        <aside class="card"><h3>Payment</h3><p>Card, PayPal, Apple Pay, and Google Pay supported.</p><a class="button primary" href="./checkout-complete.html">Place order</a></aside>
      </div>
    </main>
  </body>
</html>
